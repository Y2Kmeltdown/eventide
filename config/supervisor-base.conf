; Eventide base supervisord configuration.
;
; This file intentionally contains NO [program:*] sections.
; Base components ship as their own conf files (e.g. playback.conf) and
; modules installed from the dashboard each get a generated
; module-<name>.conf alongside this file. See docs/MODULES.md.

[supervisord]

[inet_http_server]         ; inet (TCP) server
port=*:8080        ; (ip_address:port specifier, *:port for all iface)
;username=daedalus              ; (default is no username (open server))
;password=daedalus               ; (default is no password (open server))
